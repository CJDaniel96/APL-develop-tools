[project]
name = "apl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "ultralytics>=8.3.0",
]

# Only scripts/e2e_infer.py needs these; install with `uv sync --extra e2e`.
# The HOAM package itself is loaded from its repository via --hoam-root.
[project.optional-dependencies]
e2e = [
    "anomalib>=2.1.0",
    "faiss-cpu>=1.8.0",
    "joblib>=1.3.0",
    "omegaconf>=2.3.0",
    "pytorch-metric-learning>=2.3.0",
    "timm>=0.9.0",
]

# Windows uses CUDA builds; other platforms keep the default PyPI builds.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
